name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - run: devenv shell -- ruff format --check .
      - run: devenv shell -- ruff check --select I .

  run-python-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run numbered Python files
        shell: devenv shell -- python {0}
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          files = sorted(
              path for path in Path("src").iterdir()
              if path.is_file() and re.fullmatch(r"\d+_.*\.py", path.name)
          )
          if not files:
              sys.exit("No numbered Python files found in src/")

          failed = []
          for path in files:
              print(f"::group::Run {path}", flush=True)
              result = subprocess.run([sys.executable, str(path)])
              print("::endgroup::", flush=True)
              if result.returncode:
                  failed.append(str(path))

          if failed:
              sys.exit(f"Failed files: {', '.join(failed)}")
